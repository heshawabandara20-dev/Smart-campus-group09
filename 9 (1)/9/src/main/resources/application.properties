spring.application.name=smart-campus-backend
server.port=8081

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/smart_campus_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# Admin emails (comma-separated for multiple admins)
app.admin.emails=heshawabandara20@gmail.com

# Frontend URLs
app.frontend.redirect-url=http://localhost:5173
app.frontend.origin=http://localhost:5173

# Allow bean overriding
spring.main.allow-bean-definition-overriding=true

# Logging
logging.level.com.smartcampus9=DEBUG

# Multipart file upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=1KB